name: Check Plex Remote Access

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  check-plex:
    runs-on: ubuntu-latest

    steps:
      - name: Check Plex remote access
        run: |
          if curl -k -fsS -m 15 -o /dev/null "${{ secrets.PLEX_URL }}"; then
            curl -fsS -m 10 -o /dev/null "${{ secrets.HC_PING_URL }}"
          else
            curl -fsS -m 10 -o /dev/null "${{ secrets.HC_PING_URL }}/fail"
            exit 1
          fi
